[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquefaction-timing"
version = "1.0.0"
description = "Inference and AIC post-processing for the Model 6.3 no-time liquefaction-triggering model"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
authors = [
  {name = "Bofei Xu", email = "bofei-xu@berkeley.edu"},
  {name = "Adda Athanasopoulos-Zekkos", email = "adda.zekkos@berkeley.edu"},
]
dependencies = [
  "tensorflow==2.10.1",
  "numpy==1.23.5",
  "pandas==1.5.3",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "matplotlib==3.7.5",
  "tqdm==4.67.1",
]

[project.urls]
Repository = "https://github.com/xubofei0816/liquefaction-onset-gru-aic"
"Archived release" = "https://doi.org/10.5281/zenodo.23430058"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

